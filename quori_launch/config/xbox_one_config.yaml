teleop_joy:
  ros__parameters:
    require_enable_button: True
    enable_button: 6

    axis_linear.x: 1
    axis_linear.y: 2
    axis_linear.z: 4

    scale_linear.x: 0.4
    scale_linear.y: 0.4
    scale_linear.z: 0.7

    axis_angular.yaw: 0 
    axis_angular.pitch: 6
    axis_angular.roll: 7

    scale_angular.yaw: 1.5
    scale_angular.pitch: 1.0
    scale_angular.roll: 1.0
    
head_teleop:
  ros__parameters:
    axis_neck: 4,5
    axis_pan:  6
    axis_tilt: 7