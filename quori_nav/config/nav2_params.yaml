planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True

planner_selector:
  ros__parameters:
    global_planner: nav2_navfn_planner/NavfnPlanner  # Correct plugin name

nav2_navfn_planner: # This is the namespace for the specific planner
  ros__parameters:
    tolerance: 0.5
    use_astar: true  # A* is usually used with Navfn
    allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    spin:
      plugin: "nav2_behaviors::Spin" # Correct: Full plugin name
    backup:
      plugin: "nav2_behaviors::BackUp" # Correct: Full plugin name
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading" # Correct: Full plugin name
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop" # Correct: Full plugin name
    wait:
      plugin: "nav2_behaviors::Wait" # Correct: Full plugin name
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.6, 1.0]
    min_velocity: [-0.6, -0.6, -1.0]
    max_accel: [10.0, 10.0, 3.2]
    max_decel: [-10.0, -10.0, -3.2]
    odom_topic: "odom_row"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names: ['controller_server',
                'smoother_server',
                'planner_server',
                'behavior_server',
                'bt_navigator',
                'waypoint_follower',
                'velocity_smoother',
                'collision_monitor']
    bond_timeout: 4.0
    bond_respawn_max_duration: 10.0
    attempt_respawn_reconnection: true

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names: ['map_server']
    bond_timeout: 4.0
    bond_respawn_max_duration: 10.0
    attempt_respawn_reconnection: true

lifecycle_manager_slam:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names: ['slam_toolbox']
    bond_timeout: 4.0
    bond_respawn_max_duration: 10.0
    attempt_respawn_reconnection: true

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    dock_plugins: ["fast_charger"]
    fast_charger:
      plugin: "opennav_docking::SimpleChargingDock"
      staging_x_offset: -0.7 # metres
      staging_yaw_offset: 0.0 # radians
 